<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="100" fill="none"/>
  
  <!-- Biomaterials symbol - DNA helix inspired -->
  <g>
    <!-- Left spiral -->
    <path d="M 35 25 Q 45 30 45 40 Q 45 50 35 55" 
          fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Right spiral -->
    <path d="M 55 25 Q 45 30 45 40 Q 45 50 55 55" 
          fill="none" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Center connection dots -->
    <circle cx="40" cy="35" r="2.5" fill="#4F46E5"/>
    <circle cx="50" cy="40" r="2.5" fill="#4F46E5"/>
    <circle cx="40" cy="50" r="2.5" fill="#4F46E5"/>
  </g>
  
  <!-- Centre text -->
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111827">BL</text>
  <text x="75" y="50" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Biomaterials</text>
  <text x="75" y="62" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Laboratory</text>
</svg>